name: Tendedero

on:
  schedule:
    - cron: "3-59/10 * * * *"   # cada 10 minutos (en minutos 3, 13, 23…: a la hora en punto GitHub va muy cargado)
  workflow_dispatch:            # botón "Run workflow" para correrlo a mano
  push:
    paths: ["config.yml", "avisos/**"]   # al cambiar la configuración o los avisos

permissions:
  contents: write               # guardar las fotos aprobadas en el repositorio
  pages: write                  # publicar en GitHub Pages
  id-token: write

concurrency:
  group: tendedero
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.pasada.outputs.publicar }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # siempre lo último (también al "Re-run" una pasada vieja)

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pasada del tendedero
        id: pasada
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python -m tendedero.procesar

      - name: Avisos de instancias de VRChat
        continue-on-error: true       # si VRChat falla, el tendedero sigue igual
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          VRC_USUARIO: ${{ secrets.VRC_USUARIO }}
          VRC_CONTRASENA: ${{ secrets.VRC_CONTRASENA }}
          VRC_TOTP: ${{ secrets.VRC_TOTP }}
        run: python -m avisos.instancias

      - name: Guardar fotos y estado
        run: |
          git config user.name "tendedero-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Tendedero: actualizar fotos"
            # Si alguien guardó algo mientras tanto (por ejemplo config.yml), se junta y se reintenta
            for intento in 1 2 3; do
              git push && exit 0
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            done
            exit 1
          fi

      - name: Preparar la página
        if: steps.pasada.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: procesar
    if: needs.procesar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
