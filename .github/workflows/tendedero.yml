name: Tendedero

on:
  schedule:
    - cron: "*/10 * * * *"     # cada 10 minutos (GitHub a veces se retrasa unos minutos)
  workflow_dispatch:            # botón "Run workflow" para correrlo a mano
  push:
    paths: ["config.yml"]       # al cambiar la configuración

permissions:
  contents: write               # guardar las fotos aprobadas en el repositorio
  pages: write                  # publicar en GitHub Pages
  id-token: write

concurrency:
  group: tendedero
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.pasada.outputs.publicar }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pasada del tendedero
        id: pasada
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python -m tendedero.procesar

      - name: Guardar fotos y estado
        run: |
          git config user.name "tendedero-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Tendedero: actualizar fotos"
            git push
          fi

      - name: Preparar la página
        if: steps.pasada.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: procesar
    if: needs.procesar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
