# ============================================================
#  Tendedero de Polaroids para VRChat — configuración
#  Cambia los valores de esta parte y guarda. El resto es opcional.
# ============================================================

discord:
  # Los canales van por NOMBRE. El bot los busca en los servidores donde está, así que para
  # mudar el tendedero a otro servidor basta con invitar el bot allí y crear estos dos canales.
  # Si están en varios servidores, usa el último al que invitaste el bot.
  servidor: "auto"                       # o el ID de un servidor, para fijarlo
  canal_envios: "manda-tu-polaroid"      # canal público donde la gente manda su foto
  canal_revision: "revisar-polaroids"     # canal PRIVADO: solo el bot y los admins pueden verlo
  # Quién puede aprobar. Vacío = cualquiera que pueda ver el canal de revisión (por eso tiene que
  # ser privado). Si pones roles, recuerda que cada servidor tiene los suyos.
  roles_admin_ids: []
  # Si invitas el bot a un servidor que no tiene estos canales, los crea solo (el de revisión, privado:
  # solo lo ven el bot y los roles de administrador). Necesita el permiso "Gestionar canales".
  crear_canales: true
  # Candado: el bot solo trabaja en servidores cuyo dueño seas tú (el dueño del bot en el portal de
  # Discord) o a los que tú añadiste el bot, aunque sean de otra persona (si eres admin ahí).
  # Así puedes hacer el bot público sin que nadie se lleve tu tendedero a su servidor.
  # Para permitir servidores de otras personas, pon aquí sus IDs de usuario.
  duenos_permitidos: []
  salir_de_ajenos: false   # true = el bot se sale solo de los servidores que no son tuyos

  # Borrar la foto del canal público después de pasarla a revisión (recomendado:
  # así nadie ve fotos que todavía no se aprobaron).
  borrar_original: true
  # Avisar en el canal público que la foto se recibió (el aviso se borra solo después).
  avisar_recibida: true
  # Avisar en el canal público cuando un admin aprueba la foto (también se borra solo después).
  avisar_aprobada: true
  # Confirmarle al admin (respondiendo en el canal de revisión) que su ✅ ⭐ o ❌ ya se aplicó.
  confirmar_admin: true
  minutos_aviso: 60

tendedero:
  vip: 5                 # pinzas para fotos VIP (no caducan; el admin las quita con ❌)
  comunitarias: 15       # pinzas para fotos de la comunidad
  horas_rotacion: 6      # si hay más comunitarias que pinzas, rotan cada estas horas
  dias_caducidad: 7      # las comunitarias se borran solas después de estos días
  max_guardadas: 60      # máximo de comunitarias guardadas a la vez (las más viejas salen)
  dias_pendiente: 14     # fotos sin revisar se descartan después de estos días
  vacias: "invitacion"   # pinzas vacías: "invitacion" (Polaroid con instrucciones) u "ocultar"

imagen:
  tamano_atlas: 2048     # máximo que acepta VRChat
  columnas: 5
  filas: 4               # columnas x filas = número de pinzas (vip + comunitarias)
  formato: "jpg"
  calidad: 88
  color_marco: "#f3efe6"
  color_texto: "#2a2622"
  color_vip: "#c9a227"
  max_letras_nombre: 22

textos:
  aviso_recibida: "📨 {mencion} ¡recibimos tu foto! Los admins la revisan pronto."
  aviso_aprobada: "✅ {mencion} ¡tu foto fue aprobada! En unos minutos aparece en el tendedero del mundo."
  aviso_aprobada_vip: "⭐ {mencion} ¡tu foto fue aprobada como VIP! En unos minutos aparece en el tendedero del mundo."
  revision: "📸 Foto de **{autor}**\n✅ aprobar · ⭐ aprobar como VIP · ❌ rechazar\n⏳ El bot pasa cada pocos minutos: aquí te confirma cuando lo aplique."
  aprobada: "✅ Aprobada por {admin}"
  # Respuesta al admin en el canal de revisión cuando el bot aplica su reacción (le llega notificación)
  confirma_aprobada: "{mencion} ✅ Listo: la foto de **{autor}** ya está en el tendedero. Sale en el mundo en unos minutos."
  confirma_aprobada_vip: "{mencion} ⭐ Listo: la foto de **{autor}** está en el tendedero como VIP. Sale en el mundo en unos minutos."
  confirma_rechazada: "{mencion} ❌ Listo: la foto de **{autor}** fue rechazada."
  confirma_quitada: "{mencion} 🗑️ Listo: la foto de **{autor}** ya no está en el tendedero."
  aprobada_vip: "⭐ Aprobada como VIP por {admin}"
  rechazada: "❌ Rechazada por {admin}"
  quitada: "🗑️ Quitada del tendedero por {admin}"
  caducada: "⌛ Caducó y salió del tendedero"
  pendiente_caducada: "⌛ Nadie la revisó a tiempo"
  invitacion_titulo: "¡Tu foto aquí!"
  invitacion_texto: "Mándala en Discord"

# Avisos de instancias: el bot te escribe en Discord cuando se abre una instancia de tu mundo (Cuervos Club).
# Necesita una cuenta secundaria de VRChat, en tu grupo y con permiso de ver el registro del grupo,
# guardada en los secretos VRC_USUARIO, VRC_CONTRASENA y VRC_TOTP (ver LEEME).
avisos:
  activado: true
  canal: "avisos-instancias"        # canal privado que crea el bot en el servidor del tendedero
  mundo_id: "wrld_b4d8a3fb-3e60-4305-8294-6a70cae985b6"   # Cuervos Club
  grupo_nombre: "cuervos"           # el bot busca entre sus grupos el que contenga esto
  grupo_id: ""                      # o pon el ID (grp_...) para fijarlo (sale en el registro de la pasada)
